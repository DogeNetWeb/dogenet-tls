<?xml version='1.0' encoding='UTF-8'?>
<!--
  DogeNet mark — Dogecoin Ð (U+00D0) over a white globe on a gold
  badge. Same construction as the PepeNet P-on-globe: vertical ramps, glyph
  tilted 9.8°, edged in the badge gold so the edge tracks the tile at every
  height. Square corners of the viewBox are transparent (no white fill).

  THIS IS THE SOURCE OF TRUTH for the inline copy compiled into the fail-closed
  error pages: DN_LOGO / DN_D in pepenet-tls (dogenet-tls) src/proxy.c. Keep
  the two in step. The inline copy differs only where the embedding demands it:
    - no xmlns (not needed for inline SVG in an HTML document)
    - no <title>; it carries class='lg' aria-hidden='true' instead
    - width/height 44
  Every attribute value is SINGLE-quoted, deliberately: the inline copy lives in
  a C string literal.

  Colours from the Dogecoin brand (dogecoin.com + official gold #C2A633,
  dark brown #4D3400). Three-stop badge because a linear ramp between the
  ends reads too flat; midpoint sits on the official gold.
    - badge  #d4bc4a -> #c2a633 -> #8a7018
    - white  #ffffff -> #dcddd9, shared by the globe AND the Ð
-->
<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'
     width='512' height='512' role='img' aria-label='DogeNet'
     style='background:transparent'>
  <title>DogeNet</title>

  <defs>
    <linearGradient id='dnG' x1='0' y1='0' x2='0' y2='1'>
      <stop offset='0' stop-color='#d4bc4a'/>
      <stop offset='.5' stop-color='#c2a633'/>
      <stop offset='1' stop-color='#8a7018'/>
    </linearGradient>

    <linearGradient id='dnW' gradientUnits='userSpaceOnUse' x1='0' y1='0' x2='0' y2='64'>
      <stop offset='0' stop-color='#ffffff'/>
      <stop offset='1' stop-color='#dcddd9'/>
    </linearGradient>

    <!-- cancel the glyph group's 9.8° tilt so ramps stay vertical and the
         gold edge keeps matching the badge behind it -->
    <linearGradient id='dnWp' href='#dnW' gradientTransform='rotate(-9.8 32 32)'/>
    <linearGradient id='dnGu' href='#dnG' gradientUnits='userSpaceOnUse'
                    x1='0' y1='0' x2='0' y2='64'
                    gradientTransform='rotate(-9.8 32 32)'/>
  </defs>

  <circle cx='32' cy='32' r='32' fill='url(#dnG)'/>

  <!-- the globe: rim, one meridian ellipse, the axes, and two curved parallels -->
  <g fill='none' stroke='url(#dnW)' stroke-width='2.15'>
    <circle cx='32' cy='32' r='27.6'/>
    <ellipse cx='32' cy='32' rx='16' ry='27.6'/>
    <path d='M32 4.4v55.2M4.4 32h55.2M11.2 13.8Q32 25.4 52.8 13.8M11.2 50.2Q32 38.6 52.8 50.2'/>
  </g>

  <!-- Ð (U+00D0): one evenodd path. Outer stem detours left for the bar;
       the bowl hole is notched so the bar continues inside. paint-order
       stroke keeps the gold edge outside the glyph; miterlimit 12 keeps
       corners sharp. After the 9.8° tilt the bar reads as the Dogecoin slash. -->
  <g transform='rotate(9.8 32 32)' fill='url(#dnWp)' stroke='url(#dnGu)'
     stroke-width='4' stroke-linejoin='miter' stroke-miterlimit='12'
     paint-order='stroke'>
    <path fill-rule='evenodd'
          d='M21.1 16.8h14.8c10.8 0 16.1 6.7 16.1 15.7s-5.3 15.7-16.1 15.7H21.1V33H16.2V28.7H21.1z
             M28.1 23.4h6.9c6.3 0 10.1 3.6 10.1 9.1s-3.8 9.1-10.1 9.1h-6.9V33h4.9V28.7H28.1z'/>
  </g>
</svg>
